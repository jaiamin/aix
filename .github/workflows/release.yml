name: release

# Push a tag like v0.3.0 (matching `version` in main.swift) to build and publish a release.
# The Homebrew tap (jaiamin/homebrew-aix) picks it up on its own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Check the tag matches the version
        run: test "v$(sed -n 's/^let version = "\(.*\)"/\1/p' Sources/aix/main.swift)" = "$GITHUB_REF_NAME"
      - run: swift test
      - run: make dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .build/dist/*.tar.gz --title "aix ${GITHUB_REF_NAME#v}" --generate-notes
